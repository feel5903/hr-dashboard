<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인력운영계획 보드 · 서울재활병원</title>
<style>
:root{
  --navy:#2E5A3F; --navy-d:#214430; --navy-l:#5C8A6B;
  --lime:#7FB84A; --lime-d:#4F7D25; --lime-bg:#E9F2E9;
  --now:#EEF6E4; --head:#5E9B77; --head-d:#4F8A66;
  --bg:#EEF2EE; --card:#FFFFFF; --line:#E0E6E0; --line-2:#C7D2C7;
  --ink:#232A25; --ink-2:#566056; --ink-3:#8A948C;
  --amber:#A9711A; --amber-bg:#FBEFD8; --blue:#2C6BB3; --blue-bg:#E4EEF9;
  --green:#3E7A2E; --green-bg:#E6F1DC; --red:#C0392B; --red-bg:#FBECEA;
  --radius:10px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px}

/* ===== header (award-board style) ===== */
header{background:#fff;border-bottom:2px solid var(--navy);position:sticky;top:0;z-index:40}
.hwrap{max-width:1500px;margin:0 auto;padding:20px 28px 0}
.htop{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.eyebrow{font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.4px;margin-bottom:7px}
h1.htitle{margin:0;font-size:25px;font-weight:800;color:var(--navy-d);letter-spacing:-.4px}
.hsub{margin-top:8px;font-size:12.5px;color:var(--ink-3);max-width:660px;line-height:1.5}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.statcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 15px;text-align:center;min-width:72px;cursor:pointer;transition:border-color .12s,background .12s}
.statcard:hover{border-color:var(--navy-l)}
.statcard.on{border-color:var(--lime-d);background:var(--lime-bg)}
.statcard .n{font-size:20px;font-weight:800;color:var(--navy-d);line-height:1}
.statcard .l{font-size:11px;color:var(--ink-3);margin-top:5px;font-weight:600}
.statcard.rep .n{color:var(--blue)}.statcard.fill .n{color:var(--amber)}
.statcard.inc .n{color:var(--green)}.statcard.rec .n{color:var(--red)}
.datebox{display:flex;align-items:center;gap:8px}
.datebox .dlabel{font-size:12px;color:var(--ink-3);font-weight:600}
.datebox input{border:1px solid var(--line);border-radius:9px;padding:7px 11px;background:#fff;color:var(--ink);font-weight:600}
.datebox input:focus{border-color:var(--navy);outline:none}
.hctrl{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.ylabel{font-size:12px;color:var(--ink-3);margin-right:3px;font-weight:600}
.ypill{background:#fff;border:1px solid var(--line);color:var(--ink-2);padding:5px 14px;border-radius:20px;font-size:13px;font-weight:600}
.ypill:hover{border-color:var(--navy-l)}
.ypill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.ypill.add{border-style:dashed;color:var(--ink-3)}
.ypill.add:hover{border-color:var(--navy);color:var(--navy)}
.spacer{flex:1}
.ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2);padding:6px 13px;border-radius:8px;font-size:12px;font-weight:600}
.ghost:hover{border-color:var(--navy);color:var(--navy)}
.tabs{display:flex;gap:2px}
.tab{background:transparent;color:var(--ink-3);border:none;padding:11px 17px;font-size:13.5px;font-weight:700;border-bottom:3px solid transparent}
.tab:hover{color:var(--navy)}
.tab.on{color:var(--navy-d);border-bottom-color:var(--lime)}
.editmode{display:flex;align-items:center;gap:8px;margin-right:6px}
.toggle{width:42px;height:23px;border-radius:20px;background:var(--line-2);border:none;position:relative;cursor:pointer;transition:.15s;flex:none}
.toggle.on{background:var(--head)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on::after{left:21px}
.tglabel{font-size:12px;color:var(--ink-2);font-weight:700}
.sync{font-size:11px;color:var(--ink-3);min-width:60px}
body.readonly .edit-only{display:none!important}
body.readonly .addcol{display:none!important}
body.readonly table.bt tr.dr{cursor:default}
body.readonly .datebox input{pointer-events:none;background:#F5F6F5;color:var(--ink-2)}
body.readonly .panel input,body.readonly .panel textarea{pointer-events:none;background:#F5F6F5;color:var(--ink-2)}
body.readonly .tbtn{display:none}

/* ===== body ===== */
.wrap{max-width:1500px;margin:0 auto;padding:20px 28px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:var(--hh,0);z-index:30;background:var(--bg);padding:14px 0 12px;margin-bottom:4px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{background:#fff;border:none;padding:7px 15px;font-size:12.5px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--navy);color:#fff}
.tool-sel{background:#fff;border:1px solid var(--line);border-radius:9px;padding:7px 11px;color:var(--ink);height:35px}
.searchbox{position:relative;flex:1;min-width:180px;max-width:280px}
.searchbox input{width:100%;height:35px;border:1px solid var(--line);border-radius:9px;padding:0 12px 0 30px;background:#fff}
.searchbox input:focus{border-color:var(--navy);outline:none}
.searchbox::before{content:"🔍";position:absolute;left:9px;top:9px;font-size:12px;opacity:.5}

.gsec{margin-bottom:22px}

.btwrap{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff}
table.bt{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
table.bt thead th{background:var(--head);color:#fff;font-weight:700;font-size:12px;text-align:center;padding:11px 8px;white-space:nowrap;position:sticky;top:var(--thead-top,0);z-index:5;box-shadow:inset 0 -1px 0 rgba(0,0,0,.14)}
table.bt th.l{text-align:left}
table.bt thead th.now{background:var(--head-d)}
table.bt thead th small{display:block;font-weight:400;font-size:10px;color:rgba(255,255,255,.82);margin-top:1px}
table.bt td{border-top:1px solid #EEF1EE;padding:11px 10px;vertical-align:middle;overflow-wrap:break-word}
table.bt tr.dr{cursor:pointer}
table.bt tr.dr:hover td{background:#F4F8F3}
.c-grp{color:var(--ink-2);font-weight:600;font-size:12px}
.c-dept{font-weight:600;color:var(--ink)}
.num{text-align:center;color:var(--ink-2);white-space:nowrap}
table.bt td.num.now{color:var(--navy-d);font-weight:700;background:#EEF6E4}
tr.band td{background:#F1F6EF;border-top:1px solid var(--line);padding:9px 12px}
tr.band .bname{font-weight:800;color:var(--navy-d);font-size:13.5px;border-left:3px solid var(--lime);padding-left:9px}
tr.band .bsub{color:var(--ink-3);font-size:12px;margin-left:10px}
.addcol{margin-left:12px;background:#fff;border:1px solid var(--line-2);color:var(--ink-2);border-radius:6px;padding:3px 10px;font-size:11.5px;font-weight:600}
.addcol:hover{border-color:var(--navy);color:var(--navy)}
tr.subtotal td{background:#FAFCF9;font-weight:700;color:var(--ink-2);border-top:1px solid var(--line-2)}
tr.subtotal td.now{background:#EEF6E4}
tr.grand td{background:var(--head);color:#fff;font-weight:800;border-top:2px solid var(--head)}
tr.grand td.num{color:#fff}
tr.grand td.num.now{background:var(--head-d);color:#fff}
tr.gtop td{border-top:2px solid var(--line-2)}
td.staff .pp{display:inline-block;font-size:11.5px;padding:2px 7px;border-radius:6px;background:#EEF2EC;margin:2px 3px 2px 0;white-space:nowrap}
td.staff .pp .sub{color:var(--ink-3);font-size:10.5px}
td.staff .pp.rec{background:transparent;border:1px dashed var(--red);color:var(--red);font-weight:600}
.c-reason{color:var(--ink-2);font-size:11.5px;line-height:1.5;white-space:pre-line}
.mini-badges{display:flex;flex-direction:column;gap:3px;align-items:center}
.mb{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:11px;white-space:nowrap;border:1px solid transparent}
.mb.inc{background:#DCEEC4;color:#2F5E12;border-color:#A9CE7B}
.mb.fill{background:#FBE6C0;color:#7A4E08;border-color:#E4B267}
.mb.rep{background:#D3E5F7;color:#154B84;border-color:#8FBEE6}

.print-title{display:none}
@media print{
  header,.toolbar,.overlay{display:none!important}
  #printHead.print-title{display:block;margin:0 0 8px}
  #printHead h2{margin:0;font-size:15px;color:#214430}
  #printHead .pmeta{font-size:10px;color:#555;margin-top:2px}
  .wrap{max-width:none;padding:0}
  body{background:#fff}
  .btwrap{border:none;border-radius:0}
  table.bt{width:100%;table-layout:auto;min-width:0!important;font-size:8.3px}
  table.bt thead th{position:static}
  table.bt td{padding:3px 4px}
  table.bt tr,table.bt td,table.bt th{page-break-inside:avoid}
  td.staff .pp{font-size:8px;padding:1px 4px}
  .addcol{display:none!important}
  tr.grand td,tr.band td,tr.subtotal td,table.bt td.num.now,table.bt thead th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:landscape;margin:8mm}
}

/* tabs content */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px}
.panel h3{margin:0 0 14px;font-size:15px;color:var(--navy-d)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:#EDF0F4;color:var(--ink-2);font-weight:700;text-align:left;padding:9px 10px;border-bottom:2px solid var(--line-2);font-size:12px}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:hover td{background:#FAFBFC}
table.t input,table.t textarea{width:100%;border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:5px;resize:vertical}
table.t input:hover,table.t textarea:hover{border-color:var(--line)}
table.t input:focus,table.t textarea:focus{border-color:var(--navy);outline:none;background:#fff}
.tbtn{background:#fff;border:1px solid var(--line-2);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--ink-2)}
.tbtn:hover{border-color:var(--navy);color:var(--navy)}
.iconx{background:transparent;border:none;color:var(--ink-3);font-size:15px;padding:2px 6px;border-radius:5px}
.iconx:hover{background:var(--red-bg);color:var(--red)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bcard{background:#F5F7FA;border-radius:9px;padding:13px 15px}
.bcard.total{background:var(--navy)}
.bcard label{display:block;font-size:12px;color:var(--ink-3);margin-bottom:6px}
.bcard.total label{color:rgba(255,255,255,.75)}
.bcard input{width:100%;border:none;background:transparent;font-size:16px;font-weight:700;color:var(--navy-d);text-align:right;padding:2px 0}
.bcard.total .bval{font-size:19px;font-weight:800;text-align:right;color:#fff}
.bcard .won{font-size:11px;color:var(--ink-3);text-align:right}
.guide{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px}
.gnum{flex:none;width:22px;height:22px;border-radius:6px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.guide textarea{flex:1;border:1px solid var(--line);border-radius:7px;padding:7px 10px;resize:vertical;min-height:38px}
.guide textarea:focus{border-color:var(--navy);outline:none}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(30,38,50,.5);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhead .mt{font-size:15px;font-weight:700;color:var(--navy-d)}
.mbody{padding:18px 20px;max-height:64vh;overflow:auto}
.mfoot{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:#FAFBFC;border-radius:0 0 14px 14px}
.mfoot .spacer{flex:1}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.field input:focus,.field textarea:focus{border-color:var(--navy);outline:none}
.frow{display:flex;gap:10px}.frow .field{flex:1}
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700}
.btn.primary{background:var(--navy);color:#fff}.btn.primary:hover{background:var(--navy-d)}
.btn.sub{background:#fff;border:1px solid var(--line-2);color:var(--ink-2)}.btn.sub:hover{border-color:var(--navy)}
.btn.del{background:#fff;border:1px solid var(--line-2);color:var(--red)}.btn.del:hover{background:var(--red-bg);border-color:var(--red)}
.srow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.srow input.n{flex:1.4}.srow input.s{flex:1}
.srow .rec-tag{font-size:11px;color:var(--red);font-weight:700;flex:1}
.saddrow{display:flex;gap:6px;margin-top:8px}.saddrow .tbtn{flex:1}
.hint{font-size:11px;color:var(--ink-3);margin-top:4px}
</style>
</head>
<body>
<header><div class="hwrap"></div></header>
<div id="printHead" class="print-title"></div>
<div class="wrap" id="view"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

  const card=(st,label,val,cls)=>`<div class="statcard ${cls||''} ${view.status===st?'on':''}" onclick="statClick('${st}')"><div class="n">${fmtN(val)}</div><div class="l">${label}</div></div>`;
  const stats=card('all','직원계',g.target,'total')+card('rep','대체',g.replace,'rep')+card('fill','충원',g.fill,'fill')+card('inc','증원',g.increase,'inc')+card('rec','채용중',countRec(),'rec');
  const pills=yrs.map(y=>`<button class="ypill ${y===activeYear?'on':''}" onclick="setYear('${y}')">${y}</button>`).join("")+`<button class="ypill add edit-only" onclick="newYear()">＋ 새 연도</button>`;
  const editCtl = API_URL ? `<div class="editmode"><span class="tglabel">${editMode?'편집중':'읽기전용'}</span><button class="toggle ${editMode?'on':''}" onclick="toggleEdit()" aria-label="편집모드"></button><span class="sync" id="sync"></span></div>` : "";
  const tabs=[["board","보드"],["hiring","채용사유"],["promo","승진·발령"],["budget","급여예산"],["guide","작성요령"]];
  document.querySelector("header .hwrap").innerHTML=`
    <div class="htop">
      <div class="hleft">
        <div class="eyebrow">서울재활병원 · 인사과</div>
        <h1 class="htitle">인력운영계획 보드</h1>
      </div>
      <div class="hright">
        <div class="stats">${stats}</div>
        <div class="datebox"><span class="dlabel">기준일</span><input type="text" value="${esc(Y().asOf||"")}" placeholder="예: 2026.07.28" onchange="setAsOf(this.value)"></div>
      </div>
    </div>
    <div class="hctrl">
      <span class="ylabel">연도</span>${pills}
      <span class="spacer"></span>
      ${editCtl}
      <button class="ghost" onclick="window.print()">🖨 인쇄</button>
      <button class="ghost" onclick="exportJSON()">백업 저장</button>
      <button class="ghost edit-only" onclick="document.getElementById('imp').click()">백업 열기</button>
      <input type="file" id="imp" accept="application/json" style="display:none" onchange="importJSON(event)">
    </div>
    <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${k===activeTab?'on':''}" onclick="setTab('${k}')">${l}</button>`).join("")}</div>`;
  const ph=document.getElementById("printHead"); if(ph) ph.innerHTML=`<h2>인력운영계획 보드 — ${activeYear}년</h2><div class="pmeta">서울재활병원 · 인사과 · 기준일 ${esc(Y().asOf||"")}</div>`;
}
function statClick(st){ view.status = (st==='all')?'all':(view.status===st?'all':st); activeTab='board'; render(); }
function setAsOf(v){ Y().asOf=v; save(); renderHeader(); }
function setYear(y){ activeYear=y; render(); }
function setTab(t){ activeTab=t; render(); }
function newYear(){
  const yrs=Object.keys(db.years).sort(); const latest=yrs[yrs.length-1]; const guess=String(Number(latest)+1);
  const y=prompt(latest+"년 내용을 불러와 새 연도를 만듭니다.\n연도 컬럼이 한 칸씩 이동하고, 증원요청·대체·충원·증원·사유는 초기화됩니다.\n\n새 연도:", guess);
  if(!y) return;
  if(db.years[y] && !confirm(y+"년이 이미 있습니다. 불러온 내용으로 덮어쓸까요?")) return;
  const src=structuredClone(db.years[latest]); src.label=y; src.asOf=todayStr();
  src.title=(src.title||"").replace(/^\d{4}/, y) || (y+"년도 서울재활병원 인력운영계획");
  src.groups.forEach(g=>g.departments.forEach(d=>{ d.y2024=d.y2025; d.y2025=d.target; d.req=0; d.replace=0; d.fill=0; d.increase=0; d.reason=""; d.note=""; }));
  db.years[y]=src; activeYear=y; recomputeGrand(); save(); render();
}

/* ===== board ===== */
function matchDept(d){
  if(view.q){ const q=view.q.toLowerCase(); const hay=(d.dept+" "+(d.reason||"")+" "+(d.note||"")+" "+d.staff.join(" ")).toLowerCase(); if(!hay.includes(q)) return false; }
  if(view.status==="inc" && !(d.increase>0)) return false;
  if(view.status==="fill" && !(d.fill>0)) return false;
  if(view.status==="rep" && !(d.replace>0)) return false;
  if(view.status==="rec" && !d.staff.some(s=>s.trim()==="채용중")) return false;
  return true;
}
function staffChips(d){
  const c=d.staff.map(raw=>{ const o=parseStaff(raw);
    if(o.rec) return `<span class="pp rec">채용중</span>`;
    if(o.empty) return "";
    return `<span class="pp">${esc(o.name)}${o.sub?` <span class="sub">(${esc(o.sub)})</span>`:""}</span>`;
  }).join("");
  return c||`<span style="color:var(--ink-3);font-size:11px">—</span>`;
}
function miniBadges(d){
  const b=[ d.increase>0?`<span class="mb inc">증원 ${fmtN(d.increase)}</span>`:"",
    d.fill>0?`<span class="mb fill">충원 ${fmtN(d.fill)}</span>`:"",
    d.replace>0?`<span class="mb rep">대체 ${fmtN(d.replace)}</span>`:"" ].join("");
  return b?`<div class="mini-badges">${b}</div>`:`<span style="color:var(--line-2)">·</span>`;
}
function rowHTML(gi,di,d,grpCell,gtop){
  const reason=[d.reason,d.note].filter(Boolean).join("\n");
  return `<tr class="dr ${gtop?'gtop':''}" onclick="openEdit(${gi},${di})">
    ${grpCell!==null?`<td class="c-grp">${esc(grpCell)}</td>`:""}
    <td class="c-dept">${esc(d.dept)}</td>
    <td class="num">${fmtN(d.y2024)}</td><td class="num">${fmtN(d.y2025)}</td>
    <td class="num">${(Number(d.req)||0)!==0?fmtN(d.req):'<span style="color:var(--line-2)">·</span>'}</td>
    <td class="num now">${fmtN(d.target)}</td>
    <td>${miniBadges(d)}</td>
    <td><div class="c-reason">${esc(reason)}</div></td>
    <td class="staff">${staffChips(d)}</td></tr>`;
}
function sumDepts(list){ const s={y2024:0,y2025:0,req:0,target:0,replace:0,fill:0,increase:0}; list.forEach(d=>Object.keys(s).forEach(k=>{ const n=Number(d[k]); if(!isNaN(n)) s[k]+=n; })); return s; }
function sumRow(s,label,cls,showGrp){
  return `<tr class="${cls}">${showGrp?`<td></td>`:""}
    <td class="c-dept">${label}</td>
    <td class="num">${fmtN(s.y2024)}</td><td class="num">${fmtN(s.y2025)}</td>
    <td class="num">${s.req?fmtN(s.req):'·'}</td><td class="num now">${fmtN(s.target)}</td>
    <td>${miniBadges(s)}</td><td></td><td></td></tr>`;
}
function bandRow(gi,g,sub){
  return `<tr class="band"><td colspan="8"><span class="bname">${esc(g.name)}</span><button class="addcol" onclick="event.stopPropagation();addDept(${gi})">＋ 부서 추가</button></td></tr>`;
}
function colg(showGrp){ const w=[140,58,58,72,72,104,300,430]; const cols=showGrp?[150,...w]:w; return `<colgroup>${cols.map(x=>`<col style="width:${x}px">`).join("")}</colgroup>`; }
function bhead(showGrp){
  return `<thead><tr>${showGrp?`<th class="l">구분</th>`:""}
    <th class="l">부서</th><th>${yLabel(-2)}</th><th>${yLabel(-1)}</th><th>증원요청</th>
    <th class="now">검토안<small>${yLabel(0)}</small></th><th>증감</th><th class="l">사유·비고</th><th class="l">직원 명단</th></tr></thead>`;
}
function renderBoard(){
  const groups=Y().groups;
  const groupOpts=`<option value="all">전체 부서그룹</option>`+groups.map((g,i)=>`<option value="${i}" ${view.group==String(i)?'selected':''}>${esc(g.name)}</option>`).join("");
  const minw=view.mode==="all"?1384:1234;
  const toolbar=`<div class="toolbar">
    <div class="seg"><button class="${view.mode==='all'?'on':''}" onclick="setV('mode','all')">전체</button><button class="${view.mode==='group'?'on':''}" onclick="setV('mode','group')">그룹별</button></div>
    <select class="tool-sel" onchange="setV('group',this.value)">${groupOpts}</select>
    <div class="searchbox"><input placeholder="이름·부서·사유 검색" value="${esc(view.q)}" oninput="setV('q',this.value)"></div>
  </div><div id="boardBody" data-minw="${minw}"></div>`;
  document.getElementById("view").innerHTML=toolbar; renderBoardBody();
}
function renderBoardBody(){
  const bb=document.getElementById("boardBody"); if(!bb) return;
  const minw=bb.dataset.minw; const groups=Y().groups;
  const visIdx=groups.map((g,i)=>i).filter(i=> view.group==="all" || view.group==String(i));
  let rows=""; const shown=[];
  if(view.mode==="group"){
    visIdx.forEach(gi=>{ const g=groups[gi];
      const depts=g.departments.map((d,di)=>({d,di})).filter(x=>matchDept(x.d));
      if(!depts.length) return;
      rows+=bandRow(gi,g);
      rows+=depts.map(x=>rowHTML(gi,x.di,x.d,null,false)).join("");
      depts.forEach(x=>shown.push(x.d));
    });
    const foot=shown.length?sumRow(sumDepts(shown),"직원계","grand",false):"";
    bb.innerHTML=`<div class="btwrap"><table class="bt" style="min-width:${minw}px">${colg(false)}${bhead(false)}<tbody>${rows||`<tr><td colspan="8" style="text-align:center;color:var(--ink-3);padding:22px">조건에 맞는 부서가 없습니다.</td></tr>`}</tbody><tfoot>${foot}</tfoot></table></div>`;
  }else{
    visIdx.forEach(gi=>{ const g=groups[gi]; let first=true;
      g.departments.forEach((d,di)=>{ if(!matchDept(d)) return; rows+=rowHTML(gi,di,d, first?g.name:"", first); first=false; shown.push(d); }); });
    const foot=shown.length?sumRow(sumDepts(shown),"직원계","grand",true):"";
    bb.innerHTML=`<div class="btwrap"><table class="bt" style="min-width:${minw}px">${colg(true)}${bhead(true)}<tbody>${rows||`<tr><td colspan="9" style="text-align:center;color:var(--ink-3);padding:22px">조건에 맞는 부서가 없습니다.</td></tr>`}</tbody><tfoot>${foot}</tfoot></table></div>`;
  }
}
function setV(k,v){ view[k]=v; if(k==='q') renderBoardBody(); else renderBoard(); }

/* ===== edit modal ===== */
function openEdit(gi,di){
  if(!editMode) return;
  const d=Y().groups[gi].departments[di];
  const srows=d.staff.map(raw=>staffRow(parseStaff(raw))).join("");
  document.getElementById("modal").innerHTML=`
    <div class="mhead"><span class="mt">${esc(d.dept)} 편집</span><button class="iconx" onclick="closeModal()">✕</button></div>
    <div class="mbody">
      <div class="field"><label>부서명</label><input id="f_dept" value="${esc(d.dept)}"></div>
      <div class="frow"><div class="field"><label>${yLabel(-2)}년</label><input id="f_y2024" value="${fmtN(d.y2024)}"></div>
        <div class="field"><label>${yLabel(-1)}년</label><input id="f_y2025" value="${fmtN(d.y2025)}"></div>
        <div class="field"><label>${yLabel(0)} 검토안</label><input id="f_target" value="${fmtN(d.target)}"></div></div>
      <div class="frow"><div class="field"><label>증원요청</label><input id="f_req" value="${fmtN(d.req)}"></div>
        <div class="field"><label>대체</label><input id="f_replace" value="${fmtN(d.replace)}"></div>
        <div class="field"><label>충원</label><input id="f_fill" value="${fmtN(d.fill)}"></div>
        <div class="field"><label>증원</label><input id="f_increase" value="${fmtN(d.increase)}"></div></div>
      <div class="field"><label>채용사유</label><textarea id="f_reason" rows="2">${esc(d.reason)}</textarea></div>
      <div class="field"><label>비고</label><textarea id="f_note" rows="2">${esc(d.note)}</textarea></div>
      <div class="field"><label>직원 명단 <span class="hint" style="display:inline">이름 / 괄호(대체·이전·겸임)</span></label>
        <div id="staffList">${srows}</div>
        <div class="saddrow"><button class="tbtn" onclick="addStaff(false)">＋ 직원 추가</button><button class="tbtn" onclick="addStaff(true)">＋ 채용중</button></div></div>
    </div>
    <div class="mfoot"><button class="btn del" onclick="delDept(${gi},${di})">부서 삭제</button><span class="spacer"></span>
      <button class="btn sub" onclick="closeModal()">취소</button><button class="btn primary" onclick="saveDept(${gi},${di})">저장</button></div>`;
  document.getElementById("overlay").classList.add("on");
}
function staffRow(o){
  if(o.rec) return `<div class="srow" data-rec="1"><span class="rec-tag">● 채용중 (미정)</span><button class="iconx" onclick="this.parentNode.remove()">✕</button></div>`;
  return `<div class="srow"><input class="n" placeholder="이름" value="${esc(o.name)}"><input class="s" placeholder="(대체·이전)" value="${esc(o.sub)}"><button class="iconx" onclick="this.parentNode.remove()">✕</button></div>`;
}
function addStaff(rec){ const list=document.getElementById("staffList"); const div=document.createElement("div"); div.innerHTML=staffRow(rec?{rec:true}:{name:"",sub:""}); list.appendChild(div.firstElementChild); }
function collectStaff(){ return [...document.querySelectorAll("#staffList .srow")].map(r=>{ if(r.dataset.rec) return "채용중"; return buildStaff({name:r.querySelector(".n").value, sub:r.querySelector(".s").value, rec:false}); }).filter(s=>s!==""); }
function saveDept(gi,di){
  const d=Y().groups[gi].departments[di]; const gv=id=>document.getElementById(id).value.trim();
  const nv=id=>{const v=gv(id);return v===""?0:(isNaN(Number(v))?v:Number(v));};
  d.dept=gv("f_dept")||d.dept; d.y2024=nv("f_y2024"); d.y2025=nv("f_y2025"); d.target=nv("f_target");
  d.req=nv("f_req"); d.replace=nv("f_replace"); d.fill=nv("f_fill"); d.increase=nv("f_increase");
  d.reason=gv("f_reason"); d.note=gv("f_note"); d.staff=collectStaff();
  recomputeGrand(); saveT(); closeModal(); render();
}
function delDept(gi,di){ if(!confirm("이 부서를 "+activeYear+"년에서 삭제할까요? (다른 연도는 영향 없음)")) return; Y().groups[gi].departments.splice(di,1); recomputeGrand(); saveT(); closeModal(); render(); }
function addDept(gi){ Y().groups[gi].departments.push({dept:"새 부서",y2024:0,y2025:0,req:0,target:0,replace:0,fill:0,increase:0,reason:"",note:"",staff:[]}); saveT(); render(); openEdit(gi, Y().groups[gi].departments.length-1); }
function recomputeGrand(){ const g={y2024:0,y2025:0,req:0,target:0,replace:0,fill:0,increase:0}; Y().groups.forEach(gr=>gr.departments.forEach(d=>{ ["y2024","y2025","req","target","replace","fill","increase"].forEach(k=>{ const n=Number(d[k]); if(!isNaN(n)) g[k]+=n; }); })); Y().grand=g; }
function closeModal(){ document.getElementById("overlay").classList.remove("on"); }
document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeModal(); });

/* tabs */
function renderHiring(){
  const rows=Y().hiring.map((h,i)=>`<tr><td style="width:36px;color:var(--ink-3)">${i+1}</td>
    <td style="width:120px"><input value="${esc(h.dept)}" onchange="setHir(${i},'dept',this.value)"></td>
    <td style="width:80px"><input value="${esc(h.type)}" onchange="setHir(${i},'type',this.value)"></td>
    <td><input value="${esc(h.period)}" onchange="setHir(${i},'period',this.value)"></td>
    <td style="width:60px"><input value="${esc(h.count)}" onchange="setHir(${i},'count',this.value)"></td>
    <td><textarea rows="1" onchange="setHir(${i},'note',this.value)">${esc(h.note)}</textarea></td>
    <td style="width:30px"><button class="iconx" onclick="delHir(${i})">✕</button></td></tr>`).join("");
  document.getElementById("view").innerHTML=`<div class="panel"><h3>채용사유 상세</h3>
    <table class="t"><thead><tr><th>No</th><th>부서명</th><th>계약형태</th><th>계약기간</th><th>인원</th><th>비고</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <div style="margin-top:12px"><button class="tbtn" onclick="addHir()">＋ 행 추가</button></div></div>`;
}
function setHir(i,k,v){ Y().hiring[i][k]=v; saveT(); }
function addHir(){ Y().hiring.push({no:"",dept:"",type:"",period:"",count:"",note:""}); saveT(); renderHiring(); }
function delHir(i){ Y().hiring.splice(i,1); saveT(); renderHiring(); }
function renderPromo(){
  const rows=Y().promotions.map((p,i)=>`<tr><td style="width:90px;font-weight:700;color:var(--navy-d)">${esc(p.level)}</td>
    <td><input value="${esc(p.targets)}" placeholder="대상자 이름 (쉼표로 구분)" onchange="setProm(${i},this.value)"></td></tr>`).join("");
  document.getElementById("view").innerHTML=`<div class="panel"><h3>${activeYear}년 직책발령 및 승진 대상자</h3>
    <table class="t"><thead><tr><th>구분</th><th>대상자</th></tr></thead><tbody>${rows}</tbody></table>
    <div style="margin-top:12px"><button class="tbtn" onclick="addProm()">＋ 구분 추가</button></div></div>`;
}
function setProm(i,v){ Y().promotions[i].targets=v; saveT(); }
function addProm(){ const l=prompt("구분 (예: 수석)"); if(!l)return; Y().promotions.push({level:l,targets:""}); saveT(); renderPromo(); }
function renderBudget(){
  const b=Y().budget;
  document.getElementById("view").innerHTML=`<div class="panel"><h3>급여 예산 (단위: 원)</h3><div class="bgrid">
      ${bcard("기존인력","base",b.base)}${bcard("대체예산","replaceBudget",b.replaceBudget)}${bcard("충원예산","fillBudget",b.fillBudget)}${bcard("증원예산","increaseBudget",b.increaseBudget)}
      <div class="bcard total"><label>총계</label><div class="bval">${won(b.total)}</div><div class="won" style="color:rgba(255,255,255,.7)">원</div></div></div>
    <div class="hint" style="margin-top:12px">기존인력 + 대체 + 충원 + 증원 = 총계 (자동 계산)</div></div>`;
}
function bcard(label,key,val){ return `<div class="bcard"><label>${label}</label><input value="${won(val)}" onchange="setBud('${key}',this.value)"><div class="won">원</div></div>`; }
function setBud(key,v){ Y().budget[key]=Number(String(v).replace(/[^0-9.-]/g,""))||0; const b=Y().budget; b.total=(Number(b.base)||0)+(Number(b.replaceBudget)||0)+(Number(b.fillBudget)||0)+(Number(b.increaseBudget)||0); saveT(); renderBudget(); }
function renderGuide(){
  const rows=db.guidelines.map((g,i)=>`<div class="guide"><span class="gnum">${i+1}</span><textarea rows="1" onchange="setGuide(${i},this.value)">${esc(g)}</textarea><button class="iconx" onclick="delGuide(${i})">✕</button></div>`).join("");
  document.getElementById("view").innerHTML=`<div class="panel"><h3>작성요령 <span class="hint" style="display:inline;font-weight:400">· 모든 연도 공통</span></h3>${rows}<div style="margin-top:10px"><button class="tbtn" onclick="addGuide()">＋ 항목 추가</button></div></div>`;
}
function setGuide(i,v){ db.guidelines[i]=v; saveT(); }
function addGuide(){ db.guidelines.push(""); saveT(); renderGuide(); }
function delGuide(i){ db.guidelines.splice(i,1); saveT(); renderGuide(); }

function exportJSON(){ const blob=new Blob([JSON.stringify(db,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="인력운영계획_"+todayStr()+".json"; a.click(); }
function importJSON(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.years) throw 0; db=d; activeYear=Object.keys(db.years).sort().reverse()[0]; save(); render(); alert("불러왔습니다."); }catch(err){ alert("올바른 파일이 아닙니다."); } }; r.readAsText(f); e.target.value=""; }

function updateStick(){ const h=document.querySelector('header'); const hh=h?h.offsetHeight:0; document.documentElement.style.setProperty('--hh', hh+'px'); const tb=document.querySelector('.toolbar'); const th=tb?tb.offsetHeight:0; document.documentElement.style.setProperty('--thead-top', (hh+th)+'px'); }
window.addEventListener('resize', updateStick);
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function render(){ renderHeader(); if(activeTab==="board") renderBoard(); else if(activeTab==="hiring") renderHiring(); else if(activeTab==="promo") renderPromo(); else if(activeTab==="budget") renderBudget(); else if(activeTab==="guide") renderGuide(); updateStick(); }
boot();
</script>
</body>
</html>
