<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>서울재활병원 수상이력 보드</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#F6F4EE;
    --surface:#FFFFFF;
    --ink:#1E2A24;
    --muted:#6E7A72;
    --line:#E4E1D6;
    --primary:#1F5A48;
    --primary-dark:#153F32;
    --primary-tint:#E6EFEA;
    --gold:#A9791F;
    --gold-tint:#F5EDDA;
    --blue:#33608F;
    --blue-tint:#E4ECF3;
    --purple:#755590;
    --purple-tint:#EEE7F2;
    --rose:#A34E68;
    --rose-tint:#F4E5EA;
    --slate:#5C6B72;
    --slate-tint:#EAEEEF;
    --spot:#C2531F;
    --spot-tint:#FBE8DC;
    --radius:14px;
    --shadow:0 1px 2px rgba(30,42,36,.06), 0 6px 20px rgba(30,42,36,.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1400px;margin:0 auto;padding:28px 28px 80px;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:flex-end; justify-content:space-between;
    flex-wrap:wrap; gap:20px;
    margin-bottom:22px;
    padding-bottom:20px;
    border-bottom:2px solid var(--primary);
  }
  .brand-eyebrow{
    font-size:12px; letter-spacing:.14em; font-weight:600; color:var(--primary);
    text-transform:uppercase; margin:0 0 6px;
  }
  .brand-title{
    font-size:26px; font-weight:800; margin:0; color:var(--primary-dark);
    letter-spacing:-.01em;
  }
  .stat-row{display:flex; gap:10px; flex-wrap:wrap;}
  .stat-chip{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:8px 16px; text-align:center; min-width:84px; box-shadow:var(--shadow);
  }
  .stat-chip b{display:block; font-size:19px; font-weight:800; color:var(--primary-dark); font-variant-numeric:tabular-nums;}
  .stat-chip span{font-size:11px; color:var(--muted); font-weight:600;}

  .basedate-box{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:10px 16px; box-shadow:var(--shadow);
  }
  .basedate-box label{font-size:12px; font-weight:700; color:var(--muted);}
  .basedate-box input[type=date]{
    border:none; font-family:inherit; font-size:14px; font-weight:700; color:var(--primary-dark);
    background:transparent; font-variant-numeric:tabular-nums;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    margin-bottom:18px;
  }
  .search-box{
    flex:1 1 220px; position:relative;
  }
  .search-box input{
    width:100%; padding:10px 14px 10px 36px; border-radius:10px; border:1px solid var(--line);
    font-family:inherit; font-size:14px; background:var(--surface);
  }
  .search-box::before{
    content:"⌕"; position:absolute; left:12px; top:50%; transform:translateY(-50%);
    color:var(--muted); font-size:16px;
  }
  select, .btn{
    font-family:inherit; font-size:13px; font-weight:600; border-radius:10px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:9px 12px; cursor:pointer;
  }
  .chip-toggle{
    display:flex; align-items:center; gap:6px;
    border:1px solid var(--line); border-radius:10px; padding:8px 12px;
    font-size:13px; font-weight:600; background:var(--surface); cursor:pointer; user-select:none;
    color:var(--muted);
  }
  .chip-toggle input{accent-color:var(--primary);}
  .chip-toggle.active{background:var(--primary-tint); border-color:var(--primary); color:var(--primary-dark);}
  .spacer{flex:1;}
  .btn-primary{background:var(--primary); color:#fff; border-color:var(--primary);}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-ghost{background:transparent;}
  .btn-edit-mode{
    display:flex; align-items:center; gap:8px; padding:9px 14px;
  }
  .switch{
    width:34px; height:19px; border-radius:20px; background:var(--line); position:relative; transition:.15s;
  }
  .switch::after{
    content:''; position:absolute; width:15px; height:15px; border-radius:50%; background:#fff;
    top:2px; left:2px; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .btn-edit-mode.on .switch{background:var(--spot);}
  .btn-edit-mode.on .switch::after{left:17px;}

  /* ---------- Legend ---------- */
  .legend{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .legend-item{display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--muted); font-weight:600;}
  .legend-dot{width:9px; height:9px; border-radius:50%;}

  /* ---------- Grid ---------- */
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:12px;
  }
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px 16px 14px; box-shadow:var(--shadow); cursor:pointer;
    transition:transform .1s, box-shadow .1s; position:relative;
  }
  .card:hover{transform:translateY(-2px); box-shadow:0 4px 14px rgba(30,42,36,.12);}
  .card.thisyear{border:1.5px solid var(--spot);}
  .card-star{
    position:absolute; top:-9px; right:14px; background:var(--spot); color:#fff;
    font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px;
    box-shadow:0 2px 6px rgba(194,83,31,.4);
  }
  .card-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:2px;}
  .card-name{font-size:16.5px; font-weight:800; color:var(--ink);}
  .card-dept{font-size:12px; color:var(--muted); font-weight:600; margin-top:1px;}
  .seoul-badge{
    font-size:10px; font-weight:700; color:var(--blue); background:var(--blue-tint);
    padding:2px 7px; border-radius:20px; white-space:nowrap;
  }
  .card-meta{
    display:flex; gap:14px; margin:10px 0 12px; font-size:12px; color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .card-meta b{color:var(--ink); font-weight:700;}
  .award-chips{display:flex; flex-wrap:wrap; gap:5px;}
  .achip{
    font-size:11px; font-weight:700; padding:4px 9px; border-radius:20px;
    display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
  }
  .achip .yr{font-weight:800; font-variant-numeric:tabular-nums;}
  .no-award{font-size:12px; color:var(--muted); font-style:italic;}
  .card-edit-hint{
    position:absolute; top:10px; right:10px; font-size:11px; color:var(--spot); font-weight:700; opacity:0;
  }
  .card.editmode:hover .card-edit-hint{opacity:1;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--muted);
  }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,28,24,.5); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--surface); border-radius:16px; width:100%; max-width:560px;
    max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface);
  }
  .modal-head h3{margin:0; font-size:17px; font-weight:800;}
  .modal-close{background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted);}
  .modal-body{padding:20px 22px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:5px;}
  .field input[type=text], .field input[type=date], .field select{
    width:100%; padding:9px 12px; border-radius:9px; border:1px solid var(--line);
    font-family:inherit; font-size:14px;
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .check-row{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--ink);}

  .award-list{display:flex; flex-direction:column; gap:8px; margin-bottom:10px;}
  .award-row{
    display:grid; grid-template-columns:1fr 110px auto; gap:8px; align-items:center;
    background:var(--bg); padding:8px; border-radius:9px;
  }
  .award-row .remove-award{
    background:none; border:none; color:var(--rose); font-size:16px; cursor:pointer; padding:2px 6px;
  }
  .add-award-row{
    display:grid; grid-template-columns:1fr 110px auto; gap:8px; align-items:center;
  }
  .readonly-award-list{display:flex; flex-direction:column; gap:8px;}
  .readonly-award-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:9px 12px; border-radius:9px; background:var(--bg); font-size:13px;
  }
  .readonly-award-item .aname{font-weight:700;}
  .readonly-award-item .adate{color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px;}

  .modal-foot{
    display:flex; justify-content:space-between; gap:10px; padding:16px 22px 20px;
    border-top:1px solid var(--line);
  }

  @media (max-width:640px){
    .app{padding:16px;}
    .topbar{align-items:flex-start;}
    .row2{grid-template-columns:1fr;}
  }

  /* ---------- View toggle ---------- */
  .view-toggle{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  .view-toggle-btn{
    font-family:inherit; font-size:13px; font-weight:700; padding:9px 14px; border:none;
    background:var(--surface); color:var(--muted); cursor:pointer;
  }
  .view-toggle-btn.active{background:var(--primary); color:#fff;}

  /* ---------- Table view ---------- */
  .table-wrap{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    overflow-x:auto; box-shadow:var(--shadow);
  }
  table.roster{width:100%; border-collapse:collapse; font-size:13px;}
  table.roster thead th{
    position:sticky; top:0; background:var(--primary-dark); color:#fff;
    font-size:11.5px; font-weight:700; text-align:left; padding:10px 12px; white-space:nowrap; z-index:2;
  }
  table.roster tbody td{
    padding:9px 12px; border-bottom:1px solid var(--line); vertical-align:middle;
  }
  table.roster tbody tr{cursor:pointer;}
  table.roster tbody tr:hover{background:var(--primary-tint);}
  table.roster tbody tr.thisyear{background:var(--spot-tint);}
  table.roster tbody tr.thisyear:hover{background:#f6d5bd;}
  table.roster td.name-cell{font-weight:800; white-space:nowrap;}
  table.roster td.dept-cell{color:var(--muted); font-weight:600; white-space:nowrap;}
  table.roster td.num-cell{font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--muted);}
  table.roster td.award-cell{min-width:340px;}
  .row-star{color:var(--spot); font-weight:800; margin-right:4px;}
  .mini-chip{
    font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:20px;
    display:inline-flex; align-items:center; gap:3px; white-space:nowrap; margin:1px 3px 1px 0;
  }
  .mini-chip .yr{font-weight:800;}
  .seoul-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--blue);}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div>
      <p class="brand-eyebrow">서울재활병원 · 인사과</p>
      <h1 class="brand-title">직원 수상이력 보드</h1>
      <p id="syncStatus" style="font-size:11.5px; color:var(--muted); margin:4px 0 0; font-weight:600;"></p>
    </div>
    <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <div class="stat-row" id="statRow"></div>
      <div class="basedate-box">
        <label>기준일</label>
        <input type="date" id="baseDate">
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-box"><input type="text" id="searchInput" placeholder="이름 또는 부서 검색"></div>
    <select id="deptFilter"><option value="">전체 부서</option></select>
    <button class="btn" id="addDeptBtn" style="display:none;">+ 부서 추가</button>
    <select id="sortSelect">
      <option value="name">이름순</option>
      <option value="tenure_desc">근속연수 많은순</option>
      <option value="tenure_asc">근속연수 적은순</option>
      <option value="hire_asc">입사일 빠른순</option>
      <option value="hire_desc">입사일 최근순</option>
    </select>
    <label class="chip-toggle" id="thisYearToggleWrap"><input type="checkbox" id="thisYearToggle">올해 수상만</label>
    <label class="chip-toggle" id="seoulToggleWrap"><input type="checkbox" id="seoulToggle">서울거주만</label>
    <label class="chip-toggle" id="hasAwardToggleWrap"><input type="checkbox" id="hasAwardToggle">수상이력 있음만</label>
    <label class="chip-toggle" id="noAwardToggleWrap"><input type="checkbox" id="noAwardToggle">수상이력 없음만</label>
    <div class="spacer"></div>
    <div class="view-toggle" id="viewToggle">
      <button class="view-toggle-btn active" data-view="table">☰ 표로 보기</button>
      <button class="view-toggle-btn" data-view="card">▦ 카드로 보기</button>
    </div>
    <button class="btn" id="exportBtn" title="현재 데이터를 파일로 저장">⬇ 백업</button>
    <button class="btn" id="importBtn" title="백업 파일 불러와서 복원" style="display:none;">⬆ 복원</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    <button class="btn btn-edit-mode" id="editModeBtn"><span class="switch"></span>편집모드</button>
    <button class="btn btn-primary" id="addBtn" style="display:none;">+ 직원 추가</button>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="legend-dot" style="background:var(--gold)"></span>국가·국회 포상</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--blue)"></span>서울시 포상</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--purple)"></span>은평구 포상</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--rose)"></span>유관기관 포상</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--slate)"></span>내부 포상·근속</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--spot)"></span>기준연도 수상</div>
  </div>

  <div class="table-wrap" id="tableWrap">
    <table class="roster">
      <thead>
        <tr>
          <th>이름</th>
          <th>부서</th>
          <th>서울</th>
          <th>입사일</th>
          <th>근속연수</th>
          <th>수상 이력</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
  <div class="grid" id="grid" style="display:none;"></div>
  <div class="empty-state" id="emptyState" style="display:none;">검색 조건에 맞는 직원이 없습니다.</div>
</div>

<!-- Detail (read-only) modal -->
<div class="overlay" id="viewOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="viewName"></h3>
      <button class="modal-close" id="viewClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="card-meta" id="viewMeta" style="margin-bottom:16px;"></div>
      <div class="readonly-award-list" id="viewAwards"></div>
    </div>
  </div>
</div>

<!-- Edit modal -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="editTitle">직원 정보</h3>
      <button class="modal-close" id="editClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="row2">
        <div class="field"><label>이름</label><input type="text" id="fName"></div>
        <div class="field"><label>부서</label><input type="text" id="fDept" list="deptList"></div>
      </div>
      <datalist id="deptList"></datalist>
      <div class="row2">
        <div class="field"><label>입사일</label><input type="date" id="fHire"></div>
        <div class="field" style="display:flex; align-items:flex-end;">
          <label class="check-row"><input type="checkbox" id="fSeoul"> 서울 거주자</label>
        </div>
      </div>

      <div class="field">
        <label>수상 이력</label>
        <div class="award-list" id="awardList"></div>
        <div class="add-award-row">
          <select id="newAwardName"></select>
          <input type="text" id="newAwardDate" placeholder="예: 2026.05.10  (기타는 '2026.03 OO상' 처럼 자유입력)">
          <button class="btn" id="addAwardBtn">+ 추가</button>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="deleteBtn" style="color:var(--rose); border-color:var(--rose);">🗑 직원 삭제(퇴사)</button>
      <div style="display:flex; gap:8px;">
        <button class="btn" id="cancelBtn">취소</button>
        <button class="btn btn-primary" id="saveBtn">저장</button>
      </div>
    </div>
  </div>

function todayISO(d){ return d.toISOString().slice(0,10); }

function extractYear(text){
  if(!text) return null;
  const m = String(text).match(/(20\d{2}|\d{2})[.\-\/](\d{1,2})/);
  if(m){
    let y = m[1];
    if(y.length===2) y = (parseInt(y)>50? '19':'20') + y;
    return parseInt(y);
  }
  const m2 = String(text).match(/(20\d{2})/);
  if(m2) return parseInt(m2[1]);
  return null;
}
function normalizeDateInText(text){
  if(!text) return text;
  return String(text).replace(/(^|[^0-9])(\d{2,4})[.\-](\d{1,2})(?:[.\-](\d{1,2}))?/, (m, pre, y, mo, d) => {
    let yr = y;
    if(yr.length <= 2) yr = '20' + yr.padStart(2,'0');
    mo = mo.padStart(2,'0');
    let out = pre + `${yr}.${mo}`;
    if(d) out += '.' + d.padStart(2,'0');
    return out;
  });
}
function displayAwardValue(text){
  if(!text) return '수상';
  let clean = String(text).split('\n')[0].trim();
  clean = clean.replace(/\s*[ㅇoO]\s*$/,'').trim();
  if(/^[ㅇoO]$/.test(clean)) clean = '';
  clean = normalizeDateInText(clean);
  return clean || '수상';
}
function stripLeadingDate(text){
  if(!text) return '';
  let s = String(text).split('\n')[0].trim();
  s = s.replace(/^\d{2,4}[.\-\/]\d{1,2}(?:[.\-\/]\d{1,2})?\s*/, '');
  s = s.replace(/^[ㅇoO]\s*/, '');
  return s.trim();
}
function chipLabel(name, val){
  if(name !== '기타') return name;
  const desc = stripLeadingDate(val);
  return desc || '기타';
}

function tenureText(hireISO, ref){
  if(!hireISO) return '-';
  const h = new Date(hireISO+'T00:00:00');
  if(isNaN(h)) return '-';
  let years = ref.getFullYear()-h.getFullYear();
  let months = ref.getMonth()-h.getMonth();
  if(ref.getDate() < h.getDate()) months -= 1;
  if(months < 0){ years -= 1; months += 12; }
  if(years < 0) return '입사 전';
  return years+'년 '+months+'개월';
}
function tenureMonths(hireISO, ref){
  const h = new Date(hireISO+'T00:00:00');
  if(isNaN(h)) return -99999;
  return (ref.getFullYear()-h.getFullYear())*12 + (ref.getMonth()-h.getMonth());
}

function normalizeHireDate(v){
  if(!v) return '';
  const s = String(v);
  const simple = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(simple) return s;
  const d = new Date(s);
  if(isNaN(d)) return '';
  const y = d.getFullYear();
  const mo = String(d.getMonth()+1).padStart(2,'0');
  const da = String(d.getDate()).padStart(2,'0');
  return `${y}-${mo}-${da}`;
}
function normalizeAwards(e){
  const out = {};
  for(const [name,val] of Object.entries(e.awards||{})){
    if(Array.isArray(val)) out[name] = val.filter(v=>v!=='' && v!=null);
    else if(val!=null && val!=='') out[name] = [val];
  }
  e.awards = out;
  e.hire = normalizeHireDate(e.hire);
  return e;
}
function flatAwardEntries(awards){
  const list = [];
  for(const [name, arr] of Object.entries(awards||{})){
    (arr||[]).forEach((val, idx)=> list.push({name, val, idx}));
  }
  list.sort((a,b)=>AWARD_ORDER.indexOf(a.name)-AWARD_ORDER.indexOf(b.name));
  return list;
}
function employeeHasYear(e, year){
  return flatAwardEntries(e.awards).some(en=>extractYear(en.val)===year);
}
function employeeAwardCount(e){
  return flatAwardEntries(e.awards).length;
}

      dataSource = 'sheet';
    }catch(err2){
      console.error('저장 최종 실패', err2);
      alert('구글시트 저장에 실패했습니다. 방금 하신 변경사항이 시트에 반영되지 않았을 수 있습니다.\n네트워크를 확인하고 다시 시도해주세요.');
    }
  }
  renderSyncStatus();
}
async function saveData(){ await pushToSheet(); }
async function saveDepartments(){ await pushToSheet(); }
function renderSyncStatus(){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  if(dataSource==='error'){ el.textContent = '⚠ 시트 연결 안 됨'; el.style.color = 'var(--rose)'; return; }
  if(lastModified){
    const d = new Date(lastModified);
    const txt = d.toLocaleString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
    el.textContent = '마지막 저장: '+txt;
    el.style.color = 'var(--muted)';
  } else {
    el.textContent = '';
  }
}

function uniqueDepts(){
  const fromEmployees = employees.map(e=>e.dept).filter(Boolean);
  return [...new Set([...departments, ...fromEmployees])].sort((a,b)=>a.localeCompare(b,'ko'));
}

function populateDeptFilter(){
  const sel = document.getElementById('deptFilter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">전체 부서</option>' + uniqueDepts().map(d=>`<option value="${d}">${d}</option>`).join('');
  sel.value = cur;
  document.getElementById('deptList').innerHTML = uniqueDepts().map(d=>`<option value="${d}">`).join('');
}

function render(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const dept = document.getElementById('deptFilter').value;
  const sort = document.getElementById('sortSelect').value;
  const onlyThisYear = document.getElementById('thisYearToggle').checked;
  const onlySeoul = document.getElementById('seoulToggle').checked;
  const onlyHasAward = document.getElementById('hasAwardToggle').checked;
  const onlyNoAward = document.getElementById('noAwardToggle').checked;

  const refYear = baseDate.getFullYear();

  let list = employees.filter(e=>{
    if(q && !(e.name.toLowerCase().includes(q) || (e.dept||'').toLowerCase().includes(q))) return false;
    if(dept && e.dept !== dept) return false;
    const hasThisYear = employeeHasYear(e, refYear);
    if(onlyThisYear && !hasThisYear) return false;
    if(onlySeoul && !e.seoul) return false;
    if(onlyHasAward && employeeAwardCount(e)===0) return false;
    if(onlyNoAward && employeeAwardCount(e)>0) return false;
    return true;
  });

  list.sort((a,b)=>{
    if(sort==='name') return a.name.localeCompare(b.name,'ko');
    if(sort==='tenure_desc') return tenureMonths(b.hire,baseDate)-tenureMonths(a.hire,baseDate);
    if(sort==='tenure_asc') return tenureMonths(a.hire,baseDate)-tenureMonths(b.hire,baseDate);
    if(sort==='hire_asc') return (a.hire||'').localeCompare(b.hire||'');
    if(sort==='hire_desc') return (b.hire||'').localeCompare(a.hire||'');
    return 0;
  });

  document.getElementById('emptyState').style.display = list.length? 'none':'block';
  document.getElementById('grid').style.display = (currentView==='card')? 'grid':'none';
  document.getElementById('tableWrap').style.display = (currentView==='table')? 'block':'none';

  if(currentView==='card') renderCards(list, refYear); else renderTable(list, refYear);

  // stats
  const total = employees.length;
  const thisYearCount = employees.filter(e=>employeeHasYear(e, refYear)).length;
  const seoulCount = employees.filter(e=>e.seoul).length;
  document.getElementById('statRow').innerHTML = `
    <div class="stat-chip"><b>${total}</b><span>전체 인원</span></div>
    <div class="stat-chip"><b style="color:var(--spot)">${thisYearCount}</b><span>${refYear} 수상</span></div>
    <div class="stat-chip"><b style="color:var(--blue)">${seoulCount}</b><span>서울거주</span></div>
  `;
}

function renderCards(list, refYear){
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for(const e of list){
    const hasThisYear = employeeHasYear(e, refYear);
    const card = document.createElement('div');
    card.className = 'card' + (hasThisYear?' thisyear':'') + (editMode?' editmode':'');
    const awardEntries = flatAwardEntries(e.awards);
    card.innerHTML = `
      ${hasThisYear?'<div class="card-star">★ '+refYear+' 수상</div>':''}
      ${editMode?'<div class="card-edit-hint">✎ 편집</div>':''}
      <div class="card-head">
        <div>
          <div class="card-name">${e.name}</div>
          <div class="card-dept">${e.dept||'-'}</div>
        </div>
        ${e.seoul?'<span class="seoul-badge">서울거주</span>':''}
      </div>
      <div class="card-meta">
        <span>입사 <b>${e.hire||'-'}</b></span>
        <span>근속 <b>${tenureText(e.hire, baseDate)}</b></span>
      </div>
      <div class="award-chips">
        ${awardEntries.length? awardEntries.map(({name,val})=>{
          const tier = AWARD_TIERS[name]||'slate';
          const yr = extractYear(val);
          const yrLabel = yr? `<span class="yr">'${String(yr).slice(2)}</span> ` : '';
          return `<span class="achip" style="background:var(--${tier}-tint); color:var(--${tier})">${yrLabel}${chipLabel(name,val)}</span>`;
        }).join('') : '<span class="no-award">수상이력 없음</span>'}
      </div>
    `;
    card.addEventListener('click', ()=> editMode? openEdit(e.id) : openView(e.id));
    grid.appendChild(card);
  }
}

function renderTable(list, refYear){
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  for(const e of list){
    const hasThisYear = employeeHasYear(e, refYear);
    const awardEntries = flatAwardEntries(e.awards);
    const chips = awardEntries.length? awardEntries.map(({name,val})=>{
      const tier = AWARD_TIERS[name]||'slate';
      const yr = extractYear(val);
      const yrLabel = yr? `<span class="yr">'${String(yr).slice(2)}</span> ` : '';
      return `<span class="mini-chip" style="background:var(--${tier}-tint); color:var(--${tier})">${yrLabel}${chipLabel(name,val)}</span>`;
    }).join('') : '<span class="no-award">-</span>';
    const tr = document.createElement('tr');
    tr.className = hasThisYear? 'thisyear':'';
    tr.innerHTML = `
      <td class="name-cell">${hasThisYear?'<span class="row-star">★</span>':''}${e.name}</td>
      <td class="dept-cell">${e.dept||'-'}</td>
      <td>${e.seoul?'<span class="seoul-dot" title="서울거주"></span>':''}</td>
      <td class="num-cell">${e.hire||'-'}</td>
      <td class="num-cell">${tenureText(e.hire, baseDate)}</td>
      <td class="award-cell">${chips}</td>
    `;
    tr.addEventListener('click', ()=> editMode? openEdit(e.id) : openView(e.id));
    tbody.appendChild(tr);
  }
}

function openView(id){
  const e = employees.find(x=>x.id===id);
  if(!e) return;
  document.getElementById('viewName').textContent = e.name + (e.seoul? '  ·  서울거주':'');
  document.getElementById('viewMeta').innerHTML = `<span>부서 <b>${e.dept||'-'}</b></span>&nbsp;&nbsp;<span>입사 <b>${e.hire||'-'}</b></span>&nbsp;&nbsp;<span>근속 <b>${tenureText(e.hire,baseDate)}</b></span>`;
  const awardEntries = flatAwardEntries(e.awards);
  document.getElementById('viewAwards').innerHTML = awardEntries.length? awardEntries.map(({name,val})=>{
    const tier = AWARD_TIERS[name]||'slate';
    return `<div class="readonly-award-item"><span class="aname" style="color:var(--${tier})">${name}</span><span class="adate">${displayAwardValue(val)}</span></div>`;
  }).join('') : '<div class="no-award">등록된 수상이력이 없습니다.</div>';
  document.getElementById('viewOverlay').classList.add('show');
}

function awardNameOptions(){
  return AWARD_ORDER.map(a=>`<option value="${a}">${a}</option>`).join('');
}

function renderAwardEditList(e){
  const wrap = document.getElementById('awardList');
  const entries = flatAwardEntries(e.awards);
  wrap.innerHTML = entries.length? entries.map(({name,val,idx})=>`
    <div class="award-row" data-name="${name}" data-idx="${idx}">
      <span style="font-weight:700; font-size:13px;">${name}</span>
      <span style="font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;">${displayAwardValue(val)}</span>
      <button class="remove-award" data-remove-name="${name}" data-remove-idx="${idx}">✕</button>
    </div>
  `).join('') : '<div class="no-award" style="padding:4px 0;">등록된 수상이력 없음</div>';
  wrap.querySelectorAll('[data-remove-name]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const name = btn.dataset.removeName;
      const idx = parseInt(btn.dataset.removeIdx, 10);
      draftEmployee.awards[name].splice(idx, 1);
      if(draftEmployee.awards[name].length===0) delete draftEmployee.awards[name];
      renderAwardEditList(draftEmployee);
    });
  });
}

let draftEmployee = null;

function openEdit(id){
  const existing = id ? employees.find(x=>x.id===id) : null;
  draftEmployee = existing ? JSON.parse(JSON.stringify(existing)) : {id:null, name:'', dept:'', hire:todayISO(new Date()), seoul:false, awards:{}};
  currentEditId = id || null;
  document.getElementById('editTitle').textContent = existing? existing.name+' 정보 수정' : '새 직원 추가';
  document.getElementById('fName').value = draftEmployee.name;
  document.getElementById('fDept').value = draftEmployee.dept;
  document.getElementById('fHire').value = draftEmployee.hire;
  document.getElementById('fSeoul').checked = draftEmployee.seoul;
  document.getElementById('newAwardName').innerHTML = awardNameOptions();
  document.getElementById('newAwardDate').value = '';
  document.getElementById('deleteBtn').style.display = existing? 'inline-block':'none';
  renderAwardEditList(draftEmployee);
  document.getElementById('editOverlay').classList.add('show');
}

function closeModals(){
  document.getElementById('viewOverlay').classList.remove('show');
  document.getElementById('editOverlay').classList.remove('show');
}

document.getElementById('viewClose').addEventListener('click', closeModals);
document.getElementById('viewOverlay').addEventListener('click', e=>{ if(e.target.id==='viewOverlay') closeModals(); });
document.getElementById('editClose').addEventListener('click', closeModals);
document.getElementById('cancelBtn').addEventListener('click', closeModals);
document.getElementById('editOverlay').addEventListener('click', e=>{ if(e.target.id==='editOverlay') closeModals(); });

document.getElementById('addAwardBtn').addEventListener('click', ()=>{
  const name = document.getElementById('newAwardName').value;
  const date = document.getElementById('newAwardDate').value.trim();
  if(!draftEmployee.awards) draftEmployee.awards = {};
  if(!draftEmployee.awards[name]) draftEmployee.awards[name] = [];
  draftEmployee.awards[name].push(date || 'O');
  document.getElementById('newAwardDate').value = '';
  renderAwardEditList(draftEmployee);
});

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  draftEmployee.name = document.getElementById('fName').value.trim();
  draftEmployee.dept = document.getElementById('fDept').value.trim();
  draftEmployee.hire = document.getElementById('fHire').value;
  draftEmployee.seoul = document.getElementById('fSeoul').checked;
  if(!draftEmployee.name){ alert('이름을 입력해주세요.'); return; }
  if(currentEditId){
    const idx = employees.findIndex(x=>x.id===currentEditId);
    employees[idx] = draftEmployee;
  } else {
    draftEmployee.id = 'e'+Date.now();
    employees.push(draftEmployee);
  }
  await saveData();
  populateDeptFilter();
  render();
  closeModals();
});

document.getElementById('deleteBtn').addEventListener('click', async ()=>{
  if(!currentEditId) return;
  if(!confirm(draftEmployee.name+' 님을 명단에서 삭제할까요? (퇴사 처리)')) return;
  employees = employees.filter(x=>x.id!==currentEditId);
  await saveData();
  populateDeptFilter();
  render();
  closeModals();
});

document.getElementById('addBtn').addEventListener('click', ()=> openEdit(null));

document.getElementById('editModeBtn').addEventListener('click', function(){
  editMode = !editMode;
  this.classList.toggle('on', editMode);
  document.getElementById('addBtn').style.display = editMode? 'inline-block':'none';
  document.getElementById('addDeptBtn').style.display = editMode? 'inline-block':'none';
  document.getElementById('importBtn').style.display = editMode? 'inline-block':'none';
  render();
});

document.getElementById('addDeptBtn').addEventListener('click', async ()=>{
  const name = (prompt('추가할 부서명을 입력하세요.')||'').trim();
  if(!name) return;
  if(uniqueDepts().includes(name)){ alert('이미 있는 부서명입니다.'); return; }
  departments.push(name);
  await saveDepartments();
  populateDeptFilter();
  document.getElementById('deptFilter').value = name;
  render();
  alert(`"${name}" 부서를 추가했습니다. 이제 직원 등록/수정 시 부서란에서 선택할 수 있어요.`);
});

document.getElementById('exportBtn').addEventListener('click', ()=>{
  const payload = { exportedAt: new Date().toISOString(), employees, departments };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const ts = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  a.href = url;
  a.download = `수상이력보드_백업_${ts}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', function(){
  const file = this.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data.employees)) throw new Error('형식이 올바르지 않습니다.');
      if(!confirm(`백업 파일(${data.exportedAt||'날짜 미상'})의 직원 ${data.employees.length}명 데이터로 복원할까요?\n현재 데이터는 덮어써집니다.`)) return;
      employees = data.employees.map(normalizeAwards);
      departments = Array.isArray(data.departments)? data.departments : [];
      await saveData();
      await saveDepartments();
      populateDeptFilter();
      render();
      alert('복원이 완료되었습니다.');
    }catch(err){
      alert('파일을 읽을 수 없습니다: '+err.message);
    }
    document.getElementById('importFile').value = '';
  };
  reader.readAsText(file);
});

document.querySelectorAll('.view-toggle-btn').forEach(btn=>{
  btn.addEventListener('click', function(){
    currentView = this.dataset.view;
    document.querySelectorAll('.view-toggle-btn').forEach(b=>b.classList.remove('active'));
    this.classList.add('active');
    render();
  });
});

['searchInput'].forEach(id=> document.getElementById(id).addEventListener('input', render));
['deptFilter','sortSelect'].forEach(id=> document.getElementById(id).addEventListener('change', render));
['thisYearToggle','seoulToggle','hasAwardToggle','noAwardToggle'].forEach(id=>{
  document.getElementById(id).addEventListener('change', function(){
    document.getElementById(id+'Wrap').classList.toggle('active', this.checked);
    if(this.checked && id==='hasAwardToggle'){
      document.getElementById('noAwardToggle').checked = false;
      document.getElementById('noAwardToggleWrap').classList.remove('active');
    }
    if(this.checked && id==='noAwardToggle'){
      document.getElementById('hasAwardToggle').checked = false;
      document.getElementById('hasAwardToggleWrap').classList.remove('active');
    }
    render();
  });
});
document.getElementById('baseDate').addEventListener('change', function(){
  if(this.value) baseDate = new Date(this.value+'T00:00:00');
  render();
});

(async function init(){
  document.getElementById('baseDate').value = todayISO(baseDate);
  document.getElementById('syncStatus').textContent = '구글시트에서 불러오는 중…';
  await loadData();
  renderSyncStatus();
  populateDeptFilter();
  render();
})();
</script>
</body>
</html>
